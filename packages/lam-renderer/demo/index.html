<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAM Head Demo</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1d1d1f; background: #f4f1ea; }
    body { margin: 0; display: grid; place-items: center; min-height: 100vh; }
    .card { width: min(520px, 100vw - 32px); background: #fff; border-radius: 16px; box-shadow: 0 6px 30px #0002; overflow: hidden; }
    #head { width: 100%; aspect-ratio: 1 / 1; position: relative; background: #fff; }
    .bar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid #eee; }
    button { font: inherit; padding: 8px 14px; border-radius: 999px; border: 0; background: #2d6a4f; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { font-size: 13px; color: #666; margin-left: auto; }
  </style>
</head>
<body>
  <div class="card">
    <div id="head"></div>
    <div class="bar">
      <button id="play" disabled>Play line</button>
      <span id="status">loading…</span>
    </div>
  </div>
  <audio id="audio" preload="auto"></audio>
  <script type="module" src="./main.ts"></script>
</body>
</html>
