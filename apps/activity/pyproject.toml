[project]
name = "village-activity"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["discord.py>=2.4,<3", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.runtime/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
